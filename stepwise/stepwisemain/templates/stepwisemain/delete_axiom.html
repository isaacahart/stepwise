{% extends 'stepwisemain/base.html' %}

{% block title %}Stepwise - Delete Axiom{% endblock %}
{% block content %}
<form method="post">
    {% csrf_token %}
    <p>Are you sure you want to delete {{ axiom.name }}?</p>
    <p>
        <a href="{% url 'stepwisemain:editlevel' unvid levelid %}" class="button">
            Cancel
        </a>
        <input type="submit" value="Delete" class="delete">
    </p>
</form>
{% endblock %}
